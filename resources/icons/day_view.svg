<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Single tall rectangle for one day -->
  <rect x="7" y="2" width="10" height="20" rx="2" ry="2" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Header area -->
  <line x1="7" y1="6" x2="17" y2="6" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/>
  <!-- Time lines -->
  <line x1="9" y1="10" x2="15" y2="10" stroke="#E0E0E0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="9" y1="14" x2="15" y2="14" stroke="#E0E0E0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="9" y1="18" x2="15" y2="18" stroke="#E0E0E0" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
