<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Handheld Multimeter Body -->
  <rect x="6" y="2.5" width="12" height="19" rx="2" stroke="#E0E0E0" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- LCD Display Screen -->
  <rect x="8.5" y="4.5" width="7" height="4" rx="0.5" stroke="#E0E0E0" stroke-width="1.2" fill="#E0E0E0" fill-opacity="0.2"/>
  <!-- Rotary Dial Knob -->
  <circle cx="12" cy="12" r="2.5" stroke="#E0E0E0" stroke-width="1.2"/>
  <line x1="12" y1="12" x2="13" y2="10.5" stroke="#E0E0E0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Probe Jack Sockets at bottom -->
  <circle cx="9" cy="18" r="0.8" fill="#E0E0E0"/>
  <circle cx="12" cy="18" r="0.8" fill="#E0E0E0"/>
  <circle cx="15" cy="18" r="0.8" fill="#E0E0E0"/>
</svg>
