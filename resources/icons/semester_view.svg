<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 6 rectangles in 2x3 grid for semester (6 months) -->
  <g stroke="#E0E0E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Row 1 -->
    <rect x="2" y="2" width="9" height="5.5" rx="1"/>
    <rect x="13" y="2" width="9" height="5.5" rx="1"/>
    <!-- Row 2 -->
    <rect x="2" y="9.25" width="9" height="5.5" rx="1"/>
    <rect x="13" y="9.25" width="9" height="5.5" rx="1"/>
    <!-- Row 3 -->
    <rect x="2" y="16.5" width="9" height="5.5" rx="1"/>
    <rect x="13" y="16.5" width="9" height="5.5" rx="1"/>
  </g>
</svg>
