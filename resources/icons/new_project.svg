<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- Gantt chart bars -->
  <rect x="2" y="3" width="10" height="2.5" rx="1.25" fill="#E0E0E0" fill-opacity="0.7" stroke="#E0E0E0" stroke-width="1.2"/>
  <rect x="5" y="8.5" width="9" height="2.5" rx="1.25" fill="#E0E0E0" fill-opacity="0.4" stroke="#E0E0E0" stroke-width="1.2"/>
  <rect x="3" y="14" width="7" height="2.5" rx="1.25" fill="#E0E0E0" fill-opacity="0.3" stroke="#E0E0E0" stroke-width="1.2"/>
  <!-- Plus sign -->
  <line x1="19" y1="11" x2="19" y2="21" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="16" x2="24" y2="16" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round"/>
</svg>
