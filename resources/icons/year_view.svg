<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <!-- 12 tiny rectangles in 3x4 grid for year (12 months) -->
  <g stroke="#E0E0E0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Row 1 -->
    <rect x="2" y="2" width="5.5" height="4" rx="0.5"/>
    <rect x="9.25" y="2" width="5.5" height="4" rx="0.5"/>
    <rect x="16.5" y="2" width="5.5" height="4" rx="0.5"/>
    <!-- Row 2 -->
    <rect x="2" y="7.5" width="5.5" height="4" rx="0.5"/>
    <rect x="9.25" y="7.5" width="5.5" height="4" rx="0.5"/>
    <rect x="16.5" y="7.5" width="5.5" height="4" rx="0.5"/>
    <!-- Row 3 -->
    <rect x="2" y="13" width="5.5" height="4" rx="0.5"/>
    <rect x="9.25" y="13" width="5.5" height="4" rx="0.5"/>
    <rect x="16.5" y="13" width="5.5" height="4" rx="0.5"/>
    <!-- Row 4 -->
    <rect x="2" y="18.5" width="5.5" height="4" rx="0.5"/>
    <rect x="9.25" y="18.5" width="5.5" height="4" rx="0.5"/>
    <rect x="16.5" y="18.5" width="5.5" height="4" rx="0.5"/>
  </g>
</svg>
